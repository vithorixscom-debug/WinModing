[package]
name = "winmoding"
version = "0.3.0"
edition = "2021"
rust-version = "1.77"
description = "WinModing — Modrinth-based Minecraft launcher with CurseForge"
license = "GPL-3.0-only"
publish = false

[lib]
name = "winmoding_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "WinModing"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
log = "0.4"
md-5 = "0.10"
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls", "http2", "charset", "socks", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.33"
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
rfd = "0.15"
discord-rich-presence = "0.2"
flate2 = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
